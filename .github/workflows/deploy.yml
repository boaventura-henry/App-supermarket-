name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/superlist
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/superlist

      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/superlist
          DIRECT_URL: postgresql://user:password@localhost:5432/superlist

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/superlist
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/superlist

      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/superlist
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/superlist

      - name: Build project
        run: npm run build
